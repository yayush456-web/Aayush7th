        const initializeEvents = () => {
            let events = [];
            let idCounter = 1;
            const uniqueDates = new Set();

            rawSchedule.forEach(data => {
                const title = data[4] ? data[4].trim() : '';
                // FILTER: Ignore empty SIS or Seminars
                if (!title || title === 'SIS:' || title === 'SEMINAR:') return; 

                const date = data[0];
                uniqueDates.add(date);
                
                let dept = data[5];
                const category = data[3];

                // DYNAMIC GROUP A ROUTING
                if (category === 'SYCS') dept = getSYCSDept(date);
                if (category === 'LIF' || category === 'FHE') dept = getLIFDept(date);
                if (category === 'CBL' || category === 'SGD') dept = getCBLDept(date);

                events.push({
                    id: `evt_${idCounter++}`,
                    date: date,
                    startTime: data[1],
                    endTime: data[2],
                    category: category,
                    title: title,
                    dept: dept,
                    attendance: null, // null | 'present' | 'absent'
                    isRescheduled: false,
                    isCancelled: false,
                    isAdded: false
                });
            });

            // CBL INJECTOR logic based on Generic Timetable rules (Mon, Thu, Fri 10-1)
            uniqueDates.forEach(date => {
                const d = new Date(date);
                const day = d.getDay(); // 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
                
                if (day === 1 || day === 4 || day === 5) {
                    // Don't inject if a CBL already exists for some reason
                    const hasCBL = events.some(e => e.date === date && e.category === 'CBL');
                    if (!hasCBL) {
                        events.push({
                            id: `evt_injected_${idCounter++}`,
                            date: date,
                            startTime: '10:00',
                            endTime: '13:00',
                            category: 'CBL',
                            title: 'Case Based Learning in Hospital',
                            dept: getCBLDept(date),
                            attendance: null,
                            isRescheduled: false,
                            isCancelled: false,
                            isAdded: false
                        });
                    }
                }
            });

            return events;
        };

                                newD.setDate(newD.getDate() + 1);
                                setCurrentDate(newD);
                            }} className="p-2 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100">
                                <ChevronRight size={20} />
                            </button>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 relative overflow-hidden" style={{ minHeight: `${containerHeight}px`}}>
                            {/* Time lines */}
                            {hours.map(hour => (
                                <div key={hour} className="flex border-t border-gray-100 relative" style={{ height: `${HOUR_HEIGHT}px` }}>
                                    <span className="w-16 text-[10px] sm:text-xs font-bold text-gray-400 absolute -top-2.5 bg-white pr-2">{hour}:00</span>
                                </div>
                            ))}

                            {/* Events Absolute Positioning */}
                            {dayEvents.map(event => {
                                const [sH, sM] = event.startTime.split(':').map(Number);
                                const [eH, eM] = event.endTime.split(':').map(Number);
                                
                                const startOffset = ((sH - 8) * 60 + sM) * MINUTE_HEIGHT;
                                const duration = ((eH - sH) * 60 + eM - sM) * MINUTE_HEIGHT;
                                
                                if(startOffset < 0) return null; // Before 8 AM

                                let statusClass = "bg-blue-100 border-blue-300 text-blue-900 border";
                                if (event.isAdded) statusClass = "bg-fuchsia-100 border-fuchsia-300 text-fuchsia-900 border-2 shadow-[0_0_10px_rgba(217,70,239,0.3)]";
                                else if (event.attendance === 'present') statusClass = "bg-green-100 border-green-300 text-green-900 border-2 shadow-sm";
                                else if (event.attendance === 'absent') statusClass = "bg-red-100 border-red-300 text-red-900 border-2 shadow-sm";
                                else if (event.isRescheduled) statusClass = "bg-yellow-100 border-yellow-300 text-yellow-900 border-2";
                                
                                const deptStyle = getDeptColor(event.dept);

                                return (
                                    <div 
                                        key={event.id}
                                        onClick={() => { setSelectedEvent(event); setIsModalOpen(true); }}
                                        className={`absolute left-16 right-4 rounded-xl p-2.5 overflow-hidden hover:shadow-md transition-shadow cursor-pointer flex flex-col ${statusClass}`}
                                        style={{
                                            top: `${startOffset + 16}px`, 
                                            height: `${duration}px`,
                                        }}
                                    >
                                        <div className="text-[10px] sm:text-xs font-black mb-0.5">{event.startTime} - {event.endTime}</div>
                                        <div className="font-bold text-xs sm:text-sm leading-snug line-clamp-2 min-h-0">{event.title}</div>
                                        <div className="mt-auto flex justify-between items-end pt-1 gap-2 overflow-hidden">
                                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-black truncate ${deptStyle}`}>{event.dept}</span>
                                            <span className="text-[10px] bg-black/5 px-1.5 py-0.5 rounded uppercase font-black text-gray-800 shrink-0">{event.category}</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const renderMonthView = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= daysInMonth; i++) days.push(i);

                return (
                    <div className="p-4 max-w-5xl mx-auto pb-24">
                        <div className="flex justify-between items-center mb-6 bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                            <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200">
                                <ChevronLeft size={20} />
                            </button>
                            <h2 className="text-lg font-bold text-gray-800">
                                {currentDate.toLocaleString('default', { month: 'long' })} {year}
                            </h2>
                            <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200">
                                <ChevronRight size={20} />
                            </button>
                        </div>
                        
                        <div className="grid grid-cols-7 gap-1 sm:gap-2">
                            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => (
                                <div key={d} className="text-center font-black text-gray-400 text-xs sm:text-sm py-2 uppercase tracking-wider">{d}</div>
                            ))}
                            {days.map((day, idx) => {
                                if (!day) return <div key={idx} className="p-2"></div>;
                                
                                const d = new Date(year, month, day);
                                const dateStr = getLocalYYYYMMDD(d);
                                const dayEvents = events.filter(e => e.date === dateStr);
                                
                                return (
                                    <div key={idx} className="border border-gray-100 rounded-xl p-1 sm:p-2 min-h-[100px] bg-white shadow-sm flex flex-col hover:border-indigo-200 transition-colors">
                                        <span className={`text-xs sm:text-sm font-bold w-6 h-6 flex items-center justify-center rounded-full mb-1 ${getLocalYYYYMMDD(new Date()) === dateStr ? 'bg-indigo-600 text-white' : 'text-gray-700'}`}>
                                            {day}
                                        </span>
                                        <div className="flex-1 overflow-y-auto hidden-scrollbar space-y-1">
                                            {dayEvents.map(e => {
                                                let pillClass = "bg-blue-50 text-blue-700 border-blue-200";
                                                if (e.isCancelled) pillClass = "bg-gray-800 text-gray-400 line-through";
                                                else if (e.isAdded) pillClass = "bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200 border-2";
                                                else if (e.attendance === 'present') pillClass = "bg-green-50 text-green-700 border-green-200";
                                                else if (e.attendance === 'absent') pillClass = "bg-red-50 text-red-700 border-red-200";
                                                else if (e.isRescheduled) pillClass = "bg-yellow-50 text-yellow-700 border-yellow-200";

                                                return (
                                                    <div 
                                                        key={e.id} 
                                                        onClick={() => { setSelectedEvent(e); setIsModalOpen(true); }}
                                                        className={`w-full px-1.5 py-1 rounded text-[10px] sm:text-xs cursor-pointer truncate font-bold border ${pillClass}`}
                                                    >
                                                        {e.category}
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const renderWeekView = () => {
                const startOfWeek = new Date(currentDate);
                startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());
                
                const weekDays = Array.from({length: 7}).map((_, i) => {
                    const d = new Date(startOfWeek);
                    d.setDate(d.getDate() + i);
                    return d;
                });

                return (
                    <div className="p-4 max-w-3xl mx-auto pb-24">
                        <div className="flex justify-between items-center mb-6 bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                            <button onClick={() => {
                                const newD = new Date(currentDate);
                                newD.setDate(newD.getDate() - 7);
                                setCurrentDate(newD);
                            }} className="p-2 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100">
                                <ChevronLeft size={20} />
                            </button>
                            <div className="text-center">
                                <h2 className="text-lg font-bold text-gray-800">
                                    Week of {startOfWeek.toLocaleDateString('default', { month: 'short', day: 'numeric' })}
                                </h2>
                                <p className="text-xs font-semibold text-gray-400">Tap a card to update status</p>
                            </div>
                            <button onClick={() => {
                                const newD = new Date(currentDate);
                                newD.setDate(newD.getDate() + 7);
                                setCurrentDate(newD);
                            }} className="p-2 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100">
                                <ChevronRight size={20} />
                            </button>
                        </div>

                        <div className="space-y-6">
                            {weekDays.map(date => {
                                const dateStr = getLocalYYYYMMDD(date);
                                const dayEvents = events.filter(e => e.date === dateStr).sort((a,b) => a.startTime.localeCompare(b.startTime));
                                
                                if (dayEvents.length === 0 && (date.getDay() === 0 || date.getDay() === 6)) return null;

                                return (
                                    <div key={dateStr} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                        <div className="bg-slate-50 px-5 py-3 border-b border-gray-100 font-bold text-slate-800 flex justify-between items-center">
                                            <span className="flex items-center gap-2">
                                                {getLocalYYYYMMDD(new Date()) === dateStr && <span className="w-2 h-2 rounded-full bg-indigo-600"></span>}
                                                {date.toLocaleDateString('default', { weekday: 'long' })}
                                            </span>
                                            <span className="text-slate-400 font-bold text-sm">{date.toLocaleDateString('default', { month: 'short', day: 'numeric' })}</span>
                                        </div>
                                        <div className="p-4">
                                            {dayEvents.length > 0 ? (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    {dayEvents.map(e => (
                                                        <EventBadge 
                                                            key={e.id} 
                                                            event={e} 
                                                            onClick={(evt) => { setSelectedEvent(evt); setIsModalOpen(true); }} 
                                                        />
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="text-sm font-bold text-slate-300 italic text-center py-6 bg-slate-50/50 rounded-xl border border-dashed border-slate-200">
                                                    Enjoy the time off! No classes today.
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const renderAttendanceCalculator = () => {
                // Dynamic Filter: Ignore cancelled classes!
                const relevantEvents = events.filter(e => 
                    selectedCategories.includes(e.category) && 
                    !e.isCancelled
                );
                
                const totalScheduled = relevantEvents.length;
                const pastConducted = relevantEvents.filter(e => e.attendance !== null).length;
                const attended = relevantEvents.filter(e => e.attendance === 'present').length;
                const absent = relevantEvents.filter(e => e.attendance === 'absent').length;
                
                const requiredFor80 = Math.ceil(totalScheduled * 0.8);
                const buffer = totalScheduled - requiredFor80 - absent;

                const toggleCategory = (cat) => {
                    setSelectedCategories(prev => 
                        prev.includes(cat) ? prev.filter(c => c !== cat) : [...prev, cat]
                    );
                };

                return (
                    <div className="p-4 max-w-3xl mx-auto space-y-6 pb-24">
                        
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                            <h3 className="font-bold text-gray-800 mb-2 flex items-center gap-2">
                                <Calculator size={20} className="text-indigo-600"/> 
                                Filter Categories
                            </h3>
                            <p className="text-sm font-medium text-gray-400 mb-5">Select categories to calculate combined 80% requirement (ignores cancelled classes, includes added ones):</p>
                            
                            <div className="flex flex-wrap gap-2">
                                {categories.map(cat => (
                                    <button
                                        key={cat}
                                        onClick={() => toggleCategory(cat)}
                                        className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${selectedCategories.includes(cat) ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-50 text-gray-400 border border-gray-200 hover:bg-gray-100 hover:text-gray-600'}`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                            <h3 className="font-black text-gray-800 mb-6 text-xl">Attendance Report</h3>
                            
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-center mb-8">
                                <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                    <div className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Total Sem</div>
                                    <div className="text-3xl font-black text-slate-800">{totalScheduled}</div>
                                </div>
                                <div className="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                                    <div className="text-[10px] font-black text-blue-500 uppercase tracking-wider mb-1">Conducted</div>
                                    <div className="text-3xl font-black text-blue-800">{pastConducted}</div>
                                </div>
                                <div className="p-4 bg-green-50 rounded-2xl border border-green-100">
                                    <div className="text-[10px] font-black text-green-500 uppercase tracking-wider mb-1">Attended</div>
                                    <div className="text-3xl font-black text-green-800">{attended}</div>
                                </div>
                                <div className="p-4 bg-red-50 rounded-2xl border border-red-100">
                                    <div className="text-[10px] font-black text-red-500 uppercase tracking-wider mb-1">Missed</div>
                                    <div className="text-3xl font-black text-red-800">{absent}</div>
                                </div>
                            </div>

                            <div className="border-t border-gray-100 pt-6 flex flex-col md:flex-row items-center justify-between gap-6">
                                <div className="text-center md:text-left">
                                    <div className="text-sm font-bold text-gray-400">Current Standing (Conducted)</div>
                                    <div className="text-5xl font-black mt-2">
                                        {pastConducted > 0 
                                            ? <span className={(attended/pastConducted) >= 0.8 ? 'text-green-500' : 'text-red-500'}>
                                                    {((attended / pastConducted) * 100).toFixed(1)}%
                                                </span>
                                            : <span className="text-gray-300">0.0%</span>}
                                    </div>
                                </div>

                                <div className={`p-6 rounded-3xl flex-1 text-center w-full md:w-auto shadow-sm ${buffer > 0 ? 'bg-green-50 text-green-800 border border-green-200' : buffer === 0 ? 'bg-yellow-50 text-yellow-800 border border-yellow-200' : 'bg-red-50 text-red-800 border border-red-200'}`}>
                                    <div className="font-black text-lg mb-2">80% Rule Forecast</div>
                                    {totalScheduled === 0 ? (
                                        <p className="text-sm font-medium">Select a category above.</p>
                                    ) : buffer > 0 ? (
                                        <p className="text-sm font-semibold">You can safely miss <strong className="text-xl bg-white/50 px-2 py-0.5 rounded-lg mx-1">{buffer}</strong> more class{buffer > 1 ? 'es' : ''} out of the remaining schedule.</p>
                                    ) : buffer === 0 ? (
                                        <p className="text-sm font-semibold">You are exactly on the line. You cannot afford to miss any more classes.</p>
                                    ) : (
                                        <p className="text-sm font-semibold">You are falling short. You must attend all remaining classes and somehow compensate for <strong className="text-xl bg-white/50 px-2 py-0.5 rounded-lg mx-1">{Math.abs(buffer)}</strong> class{Math.abs(buffer) > 1 ? 'es' : ''}.</p>
                                    )}
                                </div>
                            </div>
                        </div>

                    </div>
                );
            };

            const EventModal = () => {
                if (!selectedEvent) return null;
                
                const [rsDate, setRsDate] = useState(selectedEvent.date);
                const [rsStart, setRsStart] = useState(selectedEvent.startTime);
                const [rsEnd, setRsEnd] = useState(selectedEvent.endTime);

                const isCancelled = selectedEvent.isCancelled;
                const isAdded = selectedEvent.isAdded;

                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                        <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-gray-100">
                            
                            <div className={`${isCancelled ? 'bg-gray-800' : isAdded ? 'bg-fuchsia-600' : 'bg-indigo-600'} p-6 text-white flex justify-between items-start transition-colors`}>
                                <div className="pr-4">
                                    <span className={`px-3 py-1 rounded-lg text-xs font-black tracking-wider mb-3 inline-block shadow-sm ${isCancelled ? 'bg-gray-700 text-gray-300' : isAdded ? 'bg-fuchsia-500' : 'bg-indigo-500'}`}>
                                        {selectedEvent.category} {isCancelled && '• CANCELLED'}
                                    </span>
                                    <h3 className={`text-2xl font-black leading-tight ${isCancelled && 'line-through opacity-70'}`}>{selectedEvent.title}</h3>
                                </div>
                                <button onClick={() => { setIsModalOpen(false); setEditMode(false); }} className={`hover:text-white p-2 rounded-full transition-colors ${isCancelled ? 'text-gray-400 bg-gray-700/50' : 'text-white/70 bg-black/20'}`}>
                                    <XCircle size={24} />
                                </button>
                            </div>

                            <div className="p-6">
                                {!editMode ? (
                                    <>
                                        <div className={`space-y-4 mb-8 ${isCancelled && 'opacity-50'}`}>
                                            <div className="flex items-center gap-4 text-slate-700 bg-slate-50 p-4 rounded-2xl">
                                                <CalendarIcon size={22} className={isCancelled ? 'text-gray-400' : isAdded ? 'text-fuchsia-500' : 'text-indigo-500'} />
                                                <span className="font-bold">{new Date(selectedEvent.date).toLocaleDateString('default', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                                            </div>
                                            <div className="flex items-center gap-4 text-slate-700 bg-slate-50 p-4 rounded-2xl">
                                                <Clock size={22} className={isCancelled ? 'text-gray-400' : isAdded ? 'text-fuchsia-500' : 'text-indigo-500'} />
                                                <span className="font-bold">{selectedEvent.startTime} - {selectedEvent.endTime}</span>
                                            </div>
                                            <div className="flex items-center gap-4 text-slate-700 bg-slate-50 p-4 rounded-2xl">
                                                <MapPin size={22} className={isCancelled ? 'text-gray-400' : isAdded ? 'text-fuchsia-500' : 'text-indigo-500'} />
                                                <span className="font-bold">{selectedEvent.dept || 'N/A'}</span>
                                            </div>
                                        </div>

                                        {!isCancelled && (
                                            <div className="border-t border-slate-100 pt-6">
                                                <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-4 text-center">Track Your Attendance</h4>
                                                <div className="flex gap-4">
                                                    <button 
                                                        onClick={() => handleEventUpdate(selectedEvent.id, {attendance: 'present'})}
                                                        className={`flex-1 py-4 rounded-3xl flex flex-col items-center justify-center gap-2 transition-all border-2 ${selectedEvent.attendance === 'present' ? 'bg-green-500 text-white border-green-500 shadow-lg shadow-green-500/30 scale-105' : 'bg-green-50 text-green-700 border-green-100 hover:bg-green-100'}`}
                                                    >
                                                        <CheckCircle size={28} />
                                                        <span className="font-black">Present</span>
                                                    </button>
                                                    <button 
                                                        onClick={() => handleEventUpdate(selectedEvent.id, {attendance: 'absent'})}
                                                        className={`flex-1 py-4 rounded-3xl flex flex-col items-center justify-center gap-2 transition-all border-2 ${selectedEvent.attendance === 'absent' ? 'bg-red-500 text-white border-red-500 shadow-lg shadow-red-500/30 scale-105' : 'bg-red-50 text-red-700 border-red-100 hover:bg-red-100'}`}
                                                    >
                                                        <XCircle size={28} />
                                                        <span className="font-black">Absent</span>
                                                    </button>
                                                </div>
                                                {selectedEvent.attendance && (
                                                    <div className="text-center mt-4">
                                                        <button onClick={() => handleEventUpdate(selectedEvent.id, {attendance: null})} className="text-sm font-bold text-slate-400 hover:text-slate-600">
                                                            Clear Entry
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        <div className="mt-8 flex gap-3">
                                            {!isCancelled && (
                                                <button onClick={() => setEditMode(true)} className="flex-1 text-indigo-600 text-sm font-black flex items-center justify-center gap-2 p-4 bg-indigo-50 hover:bg-indigo-100 rounded-2xl transition-colors">
                                                    <Edit3 size={18} /> Reschedule
                                                </button>
                                            )}
                                            <button 
                                                onClick={() => {
                                                    if(isCancelled) handleEventUpdate(selectedEvent.id, {isCancelled: false});
                                                    else handleCancelEvent(selectedEvent.id);
                                                }} 
                                                className={`flex-1 text-sm font-black flex items-center justify-center gap-2 p-4 rounded-2xl transition-colors ${isCancelled ? 'bg-gray-100 text-gray-700 hover:bg-gray-200' : 'bg-gray-800 text-white hover:bg-gray-900 shadow-lg shadow-gray-900/20'}`}
                                            >
                                                {isCancelled ? 'Restore Class' : <><Trash2 size={18}/> Cancel Class</>}
                                            </button>

                                ) : (

                                            <Edit3 size={24} className="text-indigo-600" /> Reschedule Class
                                        </h4>
                                        
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-wider">New Date</label>
                                            <input 
                                                type="date" 
                                                value={rsDate}
                                                onChange={(e) => setRsDate(e.target.value)}
                                                className="w-full border-2 border-slate-200 p-4 rounded-2xl focus:outline-none focus:border-indigo-500 font-bold text-slate-700 transition-colors"
                                            />
                                        </div>
                                        
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-wider">Start Time</label>
                                                <input 
                                                    type="time" 
                                                    value={rsStart}
                                                    onChange={(e) => setRsStart(e.target.value)}
                                                    className="w-full border-2 border-slate-200 p-4 rounded-2xl focus:outline-none focus:border-indigo-500 font-bold text-slate-700 transition-colors"
                                                />
                                            </div>
                                            <div className="flex-1">
                                                <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-wider">End Time</label>
                                                <input 
                                                    type="time" 
                                                    value={rsEnd}
                                                    onChange={(e) => setRsEnd(e.target.value)}
                                                    className="w-full border-2 border-slate-200 p-4 rounded-2xl focus:outline-none focus:border-indigo-500 font-bold text-slate-700 transition-colors"
                                                />
                                            </div>
                                        </div>

                                        <div className="flex gap-4 pt-6">
                                            <button 
                                                onClick={() => setEditMode(false)}
                                                className="flex-1 py-4 bg-slate-100 text-slate-700 font-black rounded-2xl hover:bg-slate-200 transition-colors"
                                            >

                                            >
                                                Confirm Reschedule
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const AddEventModal = () => (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-gray-100">
                        <div className="bg-fuchsia-600 p-6 text-white flex justify-between items-start">
                            <div>
                                <span className="bg-fuchsia-500 px-3 py-1 rounded-lg text-xs font-black tracking-wider mb-2 inline-block shadow-sm">
                                    EXTRA CLASS
                                </span>
                                <h3 className="text-2xl font-black leading-tight">Add Event</h3>
                            </div>
                            <button onClick={() => setIsAddModalOpen(false)} className="text-fuchsia-200 hover:text-white bg-fuchsia-700/50 p-2 rounded-full transition-colors">
                                <XCircle size={24} />
                            </button>
                        </div>

                        <form onSubmit={handleAddEvent} className="p-6 space-y-4">
                            <div>
                                <label className="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-wider">Title / Topic</label>
                                <input required name="title" placeholder="e.g. Extra Makeup Class" className="w-full border-2 border-slate-200 p-3.5 rounded-2xl focus:outline-none focus:border-fuchsia-500 font-bold text-slate-700 transition-colors" />
                            </div>

                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-wider">Category</label>
                                    <select name="category" className="w-full border-2 border-slate-200 p-3.5 rounded-2xl focus:outline-none focus:border-fuchsia-500 font-bold text-slate-700 transition-colors bg-white">
                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                        <option value="OTHER">OTHER</option>
                                    </select>
                                </div>
                                <div className="flex-1">
                                    <label className="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-wider">Dept/Subject</label>
                                    <input required name="dept" placeholder="e.g. Surgery" className="w-full border-2 border-slate-200 p-3.5 rounded-2xl focus:outline-none focus:border-fuchsia-500 font-bold text-slate-700 transition-colors" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-wider">Date</label>
                                <input required type="date" name="date" defaultValue={getLocalYYYYMMDD(currentDate)} className="w-full border-2 border-slate-200 p-3.5 rounded-2xl focus:outline-none focus:border-fuchsia-500 font-bold text-slate-700 transition-colors" />
                            </div>
                            
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-wider">Start Time</label>
                                    <input required type="time" name="startTime" defaultValue="14:00" className="w-full border-2 border-slate-200 p-3.5 rounded-2xl focus:outline-none focus:border-fuchsia-500 font-bold text-slate-700 transition-colors" />
                                </div>
                                <div className="flex-1">
                                    <label className="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-wider">End Time</label>
                                    <input required type="time" name="endTime" defaultValue="15:00" className="w-full border-2 border-slate-200 p-3.5 rounded-2xl focus:outline-none focus:border-fuchsia-500 font-bold text-slate-700 transition-colors" />
                                </div>
                            </div>

                            <div className="pt-4">
                                <button type="submit" className="w-full py-4 bg-fuchsia-600 text-white font-black rounded-2xl hover:bg-fuchsia-700 shadow-lg shadow-fuchsia-600/30 transition-all text-lg">
                                    Add Class
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col relative">
                    {renderHeader()}
                    
                    <main className="flex-1 overflow-y-auto">
                        {view === 'day' && renderDayView()}
                        {view === 'month' && renderMonthView()}
                        {view === 'week' && renderWeekView()}
                        {view === 'attendance' && renderAttendanceCalculator()}
                    </main>

                    {/* Floating Add Button */}
                    <button 
                        onClick={() => setIsAddModalOpen(true)}
                        className="fixed bottom-6 right-6 p-4 bg-fuchsia-600 text-white rounded-full shadow-xl shadow-fuchsia-600/40 hover:scale-110 transition-transform z-40 focus:outline-none border-4 border-fuchsia-200/30"
                    >
                        <Plus size={32} strokeWidth={3} />
                    </button>

                    {isModalOpen && <EventModal />}
                    {isAddModalOpen && <AddEventModal />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
